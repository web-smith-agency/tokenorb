; TokenOrb Firmware
; Standard-Ziel: ESP32-C3 Super Mini + GC9A01 1,28" rund (Puck-Gehaeuse)
;
;   pio run -e c3            -> bauen
;   pio run -e c3 -t upload  -> flashen
;
; Weitere Varianten: s3 (ESP32-S3 N16R8 DevKit), wroom (ESP32-WROOM-32), sim (Wokwi)

[platformio]
default_envs = c3

[common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.34/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
lib_deps =
    https://github.com/lovyan03/LovyanGFX.git#1.2.36
    https://github.com/adafruit/Adafruit_NeoPixel.git#1.15.5
build_flags =
    -O2
    -DCORE_DEBUG_LEVEL=0

; ---------------------------------------------------------------- ESP32-C3 Super Mini
[env:c3]
platform = ${common.platform}
framework = ${common.framework}
board = esp32-c3-devkitm-1
board_build.flash_mode = dio
board_upload.flash_size = 4MB
board_build.partitions = min_spiffs.csv   ; 2 App-Slots fuer Updates ueber USB (NVS bleibt an 0x9000)
monitor_speed = ${common.monitor_speed}
lib_deps =
    ${common.lib_deps}
    https://github.com/h2zero/NimBLE-Arduino.git#2.5.2
build_flags =
    ${common.build_flags}
    -DBOARD_C3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ---------------------------------------------------------------- ESP32-S3 N16R8
[env:s3]
platform = ${common.platform}
framework = ${common.framework}
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
monitor_speed = ${common.monitor_speed}
lib_deps =
    ${common.lib_deps}
    https://github.com/h2zero/NimBLE-Arduino.git#2.5.2
build_flags =
    ${common.build_flags}
    -DBOARD_S3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ---------------------------------------------------------------- ESP32-WROOM-32
[env:wroom]
platform = ${common.platform}
framework = ${common.framework}
board = esp32dev
monitor_speed = ${common.monitor_speed}
board_build.partitions = min_spiffs.csv   ; 2 App-Slots fuer Updates ueber USB (NVS bleibt an 0x9000)
lib_deps =
    ${common.lib_deps}
    https://github.com/h2zero/NimBLE-Arduino.git#2.5.2
build_flags =
    ${common.build_flags}
    -DBOARD_WROOM

; ---------------------------------------------------------------- Wokwi-Simulation
; ESP32-S3 + ILI9341 als Ersatz fuer das GC9A01 (Wokwi kennt kein GC9A01),
; ohne Bluetooth (wird in Wokwi nicht simuliert). Daten per seriellem Monitor eintippen.
[env:sim]
platform = ${common.platform}
framework = ${common.framework}
board = esp32-s3-devkitc-1
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
build_flags =
    ${common.build_flags}
    -DBOARD_S3
    -DPANEL_ILI9341
    -DUSE_BLE=0
    -DSIM_BUILD
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
